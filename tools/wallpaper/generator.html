<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// ---------------------------------------------------------------
// Wallpaper generator. Domain-warped fbm -> silk bands -> palette ramp.
// Rendered at half resolution for the smooth field (it is all low
// frequency, so nothing is lost), upscaled, then grain + vignette are
// composited at full resolution where they actually need to be crisp.
// ---------------------------------------------------------------

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeNoise(seed){
  const rnd = mulberry32(seed);
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for(let i=0;i<256;i++) p[i]=i;
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t}
  for(let i=0;i<512;i++) perm[i]=p[i&255];
  const grad=(h,x,y)=>{ // 8-direction gradients
    switch(h&7){
      case 0: return  x+y; case 1: return  x-y; case 2: return -x+y; case 3: return -x-y;
      case 4: return  x;   case 5: return -x;   case 6: return  y;   default: return -y;
    }
  };
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  return function noise2(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    const xf=x-Math.floor(x), yf=y-Math.floor(y);
    const u=fade(xf), v=fade(yf);
    const aa=perm[perm[X]+Y], ab=perm[perm[X]+Y+1];
    const ba=perm[perm[X+1]+Y], bb=perm[perm[X+1]+Y+1];
    const x1=grad(aa,xf,yf)+u*(grad(ba,xf-1,yf)-grad(aa,xf,yf));
    const x2=grad(ab,xf,yf-1)+u*(grad(bb,xf-1,yf-1)-grad(ab,xf,yf-1));
    return x1+v*(x2-x1); // roughly -1..1
  };
}

function fbmFactory(noise,oct,lac,gain){
  return function(x,y){
    let a=0.5,f=1,s=0,n=0;
    for(let i=0;i<oct;i++){ s+=a*noise(x*f,y*f); n+=a; a*=gain; f*=lac; }
    return s/n;
  };
}

function srgb(c){ // linear -> sRGB
  return c<=0.0031308 ? c*12.92 : 1.055*Math.pow(c,1/2.4)-0.055;
}
function toLin(c){
  c/=255;
  return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
}
function hexLin(h){
  const n=parseInt(h.slice(1),16);
  return [toLin((n>>16)&255), toLin((n>>8)&255), toLin(n&255)];
}

// ramp: array of {t, color:[lin r,g,b]}
function sample(ramp,t){
  t=Math.max(0,Math.min(1,t));
  for(let i=0;i<ramp.length-1;i++){
    const a=ramp[i], b=ramp[i+1];
    if(t>=a.t && t<=b.t){
      const k=(t-a.t)/(b.t-a.t||1);
      const e=k*k*(3-2*k);
      return [a.c[0]+(b.c[0]-a.c[0])*e, a.c[1]+(b.c[1]-a.c[1])*e, a.c[2]+(b.c[2]-a.c[2])*e];
    }
  }
  return ramp[ramp.length-1].c;
}

window.render = function(spec, W, H){
  const c = document.getElementById('c');
  c.width=W; c.height=H;
  const ctx = c.getContext('2d');

  const SW = W>>1, SH = H>>1;                 // field resolution
  const off = document.createElement('canvas');
  off.width=SW; off.height=SH;
  const octx = off.getContext('2d');
  const img = octx.createImageData(SW,SH);
  const d = img.data;

  // Few octaves on purpose. A wallpaper wants a handful of large calm
  // features; 5 octaves of fbm reads as marble or camouflage, not cloth.
  const noise = makeNoise(spec.seed);
  const fbm   = fbmFactory(noise, spec.oct||3, 2.0, spec.gain||0.45);
  const warp  = fbmFactory(makeNoise(spec.seed+977), 2, 2.0, 0.4);

  const ramp = spec.stops.map(s=>({t:s[0], c:hexLin(s[1])}));
  const aspect = SW/SH;

  for(let y=0;y<SH;y++){
    const v = y/SH;
    for(let x=0;x<SW;x++){
      const u = x/SW;
      let px = (u-0.5)*aspect*spec.scale;
      let py = (v-0.5)*spec.scale;

      // rotate the whole field so the bands run on a diagonal
      const ca=Math.cos(spec.angle), sa=Math.sin(spec.angle);
      let rx = px*ca - py*sa, ry = px*sa + py*ca;

      // two-step domain warp: this is what turns concentric noise into
      // the folded, fabric-like ribbons rather than blobs.
      const w1x = warp(rx+0.0, ry+0.0), w1y = warp(rx+5.2, ry+1.3);
      const q1x = rx + spec.warp*w1x, q1y = ry + spec.warp*w1y;
      const w2x = warp(q1x*1.7+3.1, q1y*1.7+7.4), w2y = warp(q1x*1.7+9.2, q1y*1.7+2.8);
      const q2x = q1x + spec.warp*0.55*w2x, q2y = q1y + spec.warp*0.55*w2y;

      const base = fbm(q2x, q2y);                     // -1..1

      // silk banding. sin of the warped field is what reads as folded
      // cloth; the fbm term alone reads as fog.
      const band = 0.5 + 0.5*Math.sin(base*Math.PI*spec.bands + spec.phase);

      // light source: a broad falloff toward one corner, so the image has
      // a direction instead of being uniformly busy.
      const lx = u - spec.light[0], ly = v - spec.light[1];
      const dist = Math.sqrt(lx*lx*aspect*aspect + ly*ly);
      const key = Math.max(0, 1 - dist/spec.lightR);
      const lit = key*key;

      let t = spec.mix*band + (1-spec.mix)*(base*0.5+0.5);
      t = t*(1-spec.liftBy) + lit*spec.liftBy;
      // Gamma > 1 keeps most of the canvas in the dark end of the ramp and
      // reserves the bright stops for the few crests near the light, which
      // is the tonal distribution a real dark wallpaper has.
      t = Math.pow(Math.max(0,Math.min(1,t)), spec.gamma||1);

      let [r,g,b] = sample(ramp, t);

      // specular sheen along band crests near the light
      const sheen = Math.pow(band, 8) * lit * spec.sheen;
      r+=sheen; g+=sheen; b+=sheen;

      const i=(y*SW+x)*4;
      d[i]   = Math.max(0,Math.min(255, srgb(Math.max(0,r))*255));
      d[i+1] = Math.max(0,Math.min(255, srgb(Math.max(0,g))*255));
      d[i+2] = Math.max(0,Math.min(255, srgb(Math.max(0,b))*255));
      d[i+3] = 255;
    }
  }
  octx.putImageData(img,0,0);

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off,0,0,SW,SH,0,0,W,H);

  // vignette, so windows near the edges always have something darker
  // behind them than the centre of the screen.
  const g = ctx.createRadialGradient(W*0.5,H*0.45,Math.min(W,H)*0.15, W*0.5,H*0.5,Math.max(W,H)*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,'+spec.vignette+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // full-res grain. kills the banding that 8-bit gradients always show
  // on a large dark surface.
  const gi = ctx.getImageData(0,0,W,H);
  const gd = gi.data;
  const rnd = mulberry32(spec.seed*7+13);
  for(let i=0;i<gd.length;i+=4){
    const n=(rnd()-0.5)*spec.grain;
    gd[i]=Math.max(0,Math.min(255,gd[i]+n));
    gd[i+1]=Math.max(0,Math.min(255,gd[i+1]+n));
    gd[i+2]=Math.max(0,Math.min(255,gd[i+2]+n));
  }
  ctx.putImageData(gi,0,0);
  return true;
};
</script>
